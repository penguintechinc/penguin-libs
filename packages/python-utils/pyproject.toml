[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-utils"
version = "0.3.0"
description = "Shared Python utilities for Penguin Tech applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Penguin Tech Inc", email = "dev@penguintech.io"}
]
keywords = ["penguintech", "utilities", "flask", "pydal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydal>=20230521.1",
    "structlog>=23.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "pip-audit>=2.6",
]
flask = [
    "flask>=3.0",
]
cloudwatch = ["boto3>=1.26"]
gcp = ["google-cloud-logging>=3.0"]
kafka = ["kafka-python>=2.0"]

[project.urls]
Homepage = "https://www.penguintech.io"
Repository = "https://github.com/penguintechinc/penguin-libs"
Issues = "https://github.com/penguintechinc/penguin-libs/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
penguintechinc_utils = ["py.typed"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# "D" (pydocstyle) is D staged, not dropped: enabling it surfaces ~1,893 missing
# docstrings repo-wide, which would red the lint gate without fixing any bug.
# Re-add "D" per package once real docstrings exist -- see general.md, which
# already requires a 2-3 line docstring on every class and function.
select = ["E", "W", "F", "I", "N", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The decorator factory supports async targets, so the suite has async tests.
# Without this (and the pytest-asyncio dev dependency) pytest reports
# "Unknown pytest.mark.asyncio" and the async test fails rather than running.
asyncio_mode = "auto"
