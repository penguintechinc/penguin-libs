[package]
name = "penguin-tools-sdk"
description = "Guest-side SDK for penguin:tools WASM tool modules: descriptors, JSON Schema generation, and the #[tool] macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
keywords = ["wasm", "tools", "json-schema", "mcp"]
categories = ["wasm", "development-tools"]

[dependencies]
penguin-tools-sdk-macros = { path = "../penguin-tools-sdk-macros", version = "0.1.0" }
schemars = { version = "=1.2.3", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
