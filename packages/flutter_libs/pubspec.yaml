name: flutter_libs
description: Shared Flutter widgets for Penguin Tech applications — Elder dark theme, forms, login, sidebar, versioning.
version: 0.1.0
repository: https://github.com/penguintechinc/penguin-libs
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  crypto: 3.0.7
  file_picker: 8.3.7
  flutter_secure_storage: 9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  mocktail: 1.0.5
