[package]
name = "penguin-aaa"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "PenguinTech JWT sign/verify primitives shared across Rust services (node-agent, testserver-rs, hub-router-rs) — ES256/ES384/ES512/EdDSA verify+ES256 sign primary, RS256 verify-only legacy backup"
license = "MIT"
repository = "https://github.com/penguintechinc/penguin-libs"
authors = ["Penguin Tech Inc <support@penguintech.io>"]
keywords = ["jwt", "es256", "auth", "ecdsa"]
categories = ["authentication", "cryptography"]

[dependencies]
base64 = "=0.22.1"
der = "=0.7.10"
p256 = "=0.13.2"
p521 = "=0.13.3"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
spki = { version = "=0.7.3", features = ["pem"] }
thiserror = "=2.0.20"

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "pem", "rand_core"] }
hmac = "=0.12.1"
p384 = "=0.13.1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
