[package]
name = "penguin-licensing"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "PenguinTech license entitlement + PostHog-compatible feature flags client (license.penguintech.io)"
license-file = "LICENSE"
repository = "https://github.com/penguintechinc/penguin-libs"
authors = ["Penguin Tech Inc <support@penguintech.io>"]
keywords = ["licensing", "feature-flags", "posthog"]
categories = ["api-bindings", "config"]

[features]
default = []
# Axum 0.8 middleware: RequireFeature / RequireTier gating layers
axum = ["dep:axum", "dep:http"]

[dependencies]
arc-swap = "=1.9.2"
chrono = { version = "=0.4.45", features = ["serde"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["rt", "time", "sync", "macros"] }
tracing = "=0.1.44"
url = "=2.5.8"

axum = { version = "=0.8.9", optional = true }
http = { version = "=1.4.2", optional = true }

[dev-dependencies]
axum-test = "=21.0.0"
tokio = { version = "=1.52.3", features = ["full"] }
wiremock = "=0.6.5"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
