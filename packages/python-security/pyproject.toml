[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-security"
version = "0.1.0"
description = "PenguinTech security utilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [{name = "Penguin Tech Inc", email = "dev@penguintech.io"}]
keywords = ["penguintech", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Heavy crypto dependencies for penguin_security.crypto (formerly the
# standalone penguin-crypto package). Pins match penguin-crypto's own
# dependency set exactly. The base install never gains these transitively.
crypto = [
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
]
# AwsKmsKek only -- kept separate from `crypto` (matching penguin-crypto's
# own extras split) so importing penguin_security.crypto.envelope never
# requires boto3, and the "boto3 not installed" ImportError path stays
# testable.
aws = ["boto3>=1.34"]
flask = [
    "flask>=3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "flask>=3.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
penguin_security = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src/penguin_security"]

[tool.coverage.report]
fail_under = 90
