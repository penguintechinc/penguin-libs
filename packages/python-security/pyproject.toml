[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-security"
version = "0.1.0"
description = "PenguinTech security utilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [{name = "Penguin Tech Inc", email = "dev@penguintech.io"}]
keywords = ["penguintech", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
penguin_security = ["py.typed"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# "D" (pydocstyle) is D staged, not dropped: enabling it surfaces ~1,893 missing
# docstrings repo-wide, which would red the lint gate without fixing any bug.
# Re-add "D" per package once real docstrings exist -- see general.md, which
# already requires a 2-3 line docstring on every class and function.
select = ["E", "W", "F", "I", "N", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
disallow_untyped_defs = true
