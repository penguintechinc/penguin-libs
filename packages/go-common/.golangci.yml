version: "2"
linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - noctx
    - exhaustive
  settings:
    exhaustive:
      default-signifies-exhaustive: true
run:
  timeout: 5m

issues:
  # Report every occurrence. Defaults (max-same-issues: 3,
  # max-issues-per-linter: 50) truncate the list, which turns fixing lint
  # into repeated rounds where each pass reveals another three.
  max-issues-per-linter: 0
  max-same-issues: 0
