[package]
name = "penguin-dal"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "PenguinTech Data Access Layer (DAL) for Rust — unified database pools (PostgreSQL/SQLite via sqlx), S3/MinIO object storage, cache, and stream contracts"
license = "MIT"
repository = "https://github.com/penguintechinc/penguin-libs"
authors = ["Penguin Tech Inc <support@penguintech.io>"]
keywords = ["dal", "database", "s3", "storage", "sqlx"]
categories = ["database", "web-programming"]

[features]
default = ["sql", "storage"]
sql = ["dep:sqlx"]
storage = ["dep:aws-sdk-s3", "dep:aws-config", "dep:url"]

[dependencies]
tokio = { version = "=1.54.1", features = ["sync", "time", "rt"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tracing = "=0.1.44"
figment = { version = "=0.10.19", features = ["env"] }
async-trait = "=0.1.92"
bytes = "=1.12.1"

# sql feature
sqlx = { version = "=0.9.0", optional = true, default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "sqlite-unbundled",
    "chrono",
    "uuid",
    "json",
    "macros",
] }

# storage feature
url = { version = "=2.5.8", optional = true }
aws-config = { version = "=1.13.1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "credentials-process",
    "sso",
] }
aws-sdk-s3 = { version = "=1.158.0", optional = true, default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
