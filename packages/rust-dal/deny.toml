# cargo-deny configuration for penguin-dal.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0459 (libsqlite3-sys, bundled SQLite C source < 3.54.0).
    # Reason: advisory affects only the BUNDLED copy; this crate uses sqlx `sqlite-unbundled`
    #   and links the system libsqlite3. sqlx-sqlite 0.9.0 pins libsqlite3-sys <0.38, so the
    #   crate stays in the lockfile although its bundled source is never compiled.
    # Added: 2026-11-09.
    # Remove when: sqlx allows libsqlite3-sys >=0.39 (patched release).
    "RUSTSEC-2026-0459",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla root store data), permissive
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
