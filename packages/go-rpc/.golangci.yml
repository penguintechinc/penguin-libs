version: "2"
linters:
  enable:
    - bodyclose
    - exhaustive
    - gosec
    - noctx
  settings:
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  # Report every occurrence. Defaults (max-same-issues: 3,
  # max-issues-per-linter: 50) truncate the list, which turns fixing lint
  # into repeated rounds where each pass reveals another three.
  max-issues-per-linter: 0
  max-same-issues: 0
