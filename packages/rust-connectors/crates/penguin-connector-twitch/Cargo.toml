[package]
name = "penguin-connector-twitch"
description = "Twitch connector: IRC chat receive/send, EventSub webhook signature verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["twitch", "irc", "eventsub", "connector"]
categories = ["network-programming", "asynchronous"]

[dependencies]
hex = "=0.4.3"
hmac = "=0.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.20"
time = { version = "=0.3.55", default-features = false, features = ["std", "parsing"] }
tokio = { version = "=1.53.1", features = ["net", "rt", "io-util", "time", "macros", "sync"] }
tokio-rustls = "=0.26.5"
tracing = "=0.1.44"
webpki-roots = "=1.0.9"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["full"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
