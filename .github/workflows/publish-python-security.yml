name: Publish penguin-security

on:
  push:
    tags:
      - 'penguin-security-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish penguin-security to PyPI
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python3 -m pip install --upgrade pip
          pip3 install build twine

      - name: Build package
        run: python3 -m build
        working-directory: packages/python-security

      - name: Check package
        run: twine check dist/*
        working-directory: packages/python-security

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/python-security/dist/

      - name: Create release summary
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "## Published Package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: penguin-security" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: \$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: PyPI (trusted publishing)" >> $GITHUB_STEP_SUMMARY
        working-directory: packages/python-security
