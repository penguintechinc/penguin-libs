name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  build-react:
    name: Build & Test React Libs
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/react-libs/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      # zizmor cache-poisoning false positive: setup-node v4.0.2 caches nothing unless `cache:` is set (explicitly false below); the package-manager-cache input zizmor keys on only exists in v5+.
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
          cache: false
      - run: npm ci
      - name: Security
        run: npm audit --omit=dev
      - run: npm run build -w @penguintechinc/react-libs
      - run: npm run typecheck -w @penguintechinc/react-libs
      - run: npm run test -w @penguintechinc/react-libs

  build-react-aaa:
    name: Build & Test React AAA
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/react-aaa/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      # zizmor cache-poisoning false positive: setup-node v4.0.2 caches nothing unless `cache:` is set (explicitly false below); the package-manager-cache input zizmor keys on only exists in v5+.
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 20
          cache: false
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build -w @penguintechinc/react-aaa
      - name: Typecheck
        run: npm run typecheck -w @penguintechinc/react-aaa
      - name: Lint
        run: npm run lint -w @penguintechinc/react-aaa
      - name: Test
        run: npm test -w @penguintechinc/react-aaa
      - name: Security
        run: npm audit --omit=dev

  build-python:
    name: Build & Test Python Packages
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/python-crypto/') || startsWith(github.ref, 'refs/heads/release/python-security/') || startsWith(github.ref, 'refs/heads/release/python-libs/') || startsWith(github.ref, 'refs/heads/release/python-licensing/') || startsWith(github.ref, 'refs/heads/release/python-secrets/') || startsWith(github.ref, 'refs/heads/release/python-utils/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: '3.13'
      - run: pip install build pytest pytest-asyncio requests bandit pip-audit
      - run: |
          pip install -e "packages/python-crypto"
          pip install -e "packages/python-security"
          pip install -e "packages/python-libs[all,dev]"
      - run: pytest packages/python-libs/tests -v
      - run: pip install -e "packages/python-licensing[dev]"
      - run: pytest packages/python-licensing/tests -v
      - run: cd packages/python-secrets && pip install -e ".[dev]" && pytest tests -v
      - name: Lint - python-utils
        run: cd packages/python-utils && ruff check src/ tests/
      - name: Security - bandit
        run: cd packages/python-utils && bandit -r src/ -c pyproject.toml
      - name: Security - pip-audit
        run: cd packages/python-utils && pip-audit --ignore-vuln CVE-2026-3219

  build-python-aaa:
    name: Build & Test Python AAA
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/python-aaa/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: '3.13'
      - name: Install
        run: cd packages/python-aaa && pip install -e ".[dev]"
      - name: Lint
        run: cd packages/python-aaa && ruff check src/ tests/
      - name: Format check
        run: cd packages/python-aaa && ruff format --check src/ tests/
      - name: Type check
        run: cd packages/python-aaa && mypy src/
      - name: Security - bandit
        run: cd packages/python-aaa && bandit -r src/ -c pyproject.toml
      - name: Security - pip-audit
        run: cd packages/python-aaa && pip-audit --ignore-vuln CVE-2026-3219
      - name: Test
        run: cd packages/python-aaa && pytest tests/ -v --tb=short --cov=penguin_aaa

  build-go:
    name: Build & Test Go Packages
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/go-common/') || startsWith(github.ref, 'refs/heads/release/go-h3/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: '1.25'
          cache: false
      - run: go test ./...
        working-directory: packages/go-common
      - run: go mod download
        working-directory: packages/go-h3
      - run: go test -race ./...
        working-directory: packages/go-h3
      - name: Lint - go-common
        uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86 # v6.1.0
        with:
          working-directory: packages/go-common
      - name: Security - govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
          cd packages/go-common && govulncheck ./...
      - name: Security - gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.21.0
          cd packages/go-common && gosec -quiet ./...

  build-go-aaa:
    name: Build & Test Go AAA
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/go-aaa/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: '1.25'
          cache: false
      - name: Build
        run: cd packages/go-aaa && go build ./...
      - name: Vet
        run: cd packages/go-aaa && go vet ./...
      - name: Test
        run: cd packages/go-aaa && go test -race -v ./...
      - name: Lint
        uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86 # v6.1.0
        with:
          working-directory: packages/go-aaa
      - name: Security - govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
          cd packages/go-aaa && govulncheck ./...
      - name: Security - gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.21.0
          cd packages/go-aaa && gosec -quiet ./...

  build-react-testutils:
    name: Build & Test react-testutils
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/react-testutils/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      # zizmor cache-poisoning false positive: setup-node v4.0.2 caches nothing unless `cache:` is set (explicitly false below); the package-manager-cache input zizmor keys on only exists in v5+.
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
          cache: false
      - name: Install
        run: npm ci
      - name: Build (typecheck)
        run: npm run build -w @penguintechinc/react-testutils
      - name: Typecheck
        run: npm run typecheck -w @penguintechinc/react-testutils
      - name: Test
        run: npm run test -w @penguintechinc/react-testutils
      - name: Security
        run: npm audit --omit=dev

  build-flutter:
    name: Build Flutter Libs
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/flutter_libs/') }}
    defaults:
      run:
        working-directory: packages/flutter_libs
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1c5eb12d812966ca84680edc38353a0851c8fd56 # v2.14.0
        with:
          flutter-version: '3.44.8'  # keep in sync with .fvmrc
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-go-rpc:
    name: Build & Test Go RPC
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/go-rpc/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: false
      - name: Build
        run: cd packages/go-rpc && go build ./...
      - name: Test (coverage-gated, 90% minimum)
        run: |
          cd packages/go-rpc
          go test -race -coverprofile=cover.out $(go list ./... | grep -v /gen/ | grep -v /examples/ | grep -v /integration/)
          go tool cover -func=cover.out
          COVERAGE=$(go tool cover -func=cover.out | grep ^total: | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov+0 < 90.0) { exit 1 } }' || { echo "FAIL: coverage ${COVERAGE}% is below the 90% threshold"; exit 1; }
      - name: Lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          working-directory: packages/go-rpc
      - name: Security - govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          cd packages/go-rpc && govulncheck ./...
      - name: Security - gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          cd packages/go-rpc && gosec -quiet ./...

  build-python-rpc:
    name: Build & Test Python RPC
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/python-rpc/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install
        run: cd packages/python-rpc && pip install -e ".[dev]"
      - name: Lint
        run: cd packages/python-rpc && ruff check src/ tests/
      - name: Format check
        run: cd packages/python-rpc && ruff format --check src/ tests/
      - name: Type check
        run: cd packages/python-rpc && mypy src/
      - name: Security - bandit
        run: cd packages/python-rpc && bandit -r src/ -c pyproject.toml
      - name: Security - pip-audit
        run: cd packages/python-rpc && pip install pip-audit && pip-audit
      - name: Test
        run: cd packages/python-rpc && pytest tests/ -v --tb=short --cov=penguin_prpc

  build-rust-rpc:
    name: Build & Test Rust RPC
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/rust-rpc/') }}
    defaults:
      run:
        working-directory: packages/rust-rpc
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-06-30)
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - name: Format check
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Security - cargo-deny
        run: |
          cargo install cargo-deny --version 0.18.9 --locked
          cargo deny check

  build-react-form-builder:
    name: Build & Test React Form Builder
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/react-form-builder/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      # zizmor cache-poisoning false positive: setup-node v4.0.2 caches nothing unless `cache:` is set (explicitly false below); the package-manager-cache input zizmor keys on only exists in v5+.
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
          cache: false
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build -w @penguintechinc/react-form-builder
      - name: Typecheck
        run: npm run typecheck -w @penguintechinc/react-form-builder
      - name: Test
        run: npm run test -w @penguintechinc/react-form-builder
      - name: Security
        run: npm audit --omit=dev

  build-react-login:
    name: Build & Test React Login
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/react-login/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      # zizmor cache-poisoning false positive: setup-node v4.0.2 caches nothing unless `cache:` is set (explicitly false below); the package-manager-cache input zizmor keys on only exists in v5+.
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
          cache: false
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build -w @penguintechinc/react-login
      - name: Typecheck
        run: npm run typecheck -w @penguintechinc/react-login
      - name: Test
        run: npm run test -w @penguintechinc/react-login
      - name: Security
        run: npm audit --omit=dev

  build-react-sidebar:
    name: Build & Test React Sidebar
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/react-sidebar/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      # zizmor cache-poisoning false positive: setup-node v4.0.2 caches nothing unless `cache:` is set (explicitly false below); the package-manager-cache input zizmor keys on only exists in v5+.
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
          cache: false
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build -w @penguintechinc/react-sidebar
      - name: Typecheck
        run: npm run typecheck -w @penguintechinc/react-sidebar
      - name: Test
        run: npm run test -w @penguintechinc/react-sidebar
      - name: Security
        run: npm audit --omit=dev

  build-react-console-version:
    name: Build & Test React Console Version
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/react-console-version/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      # zizmor cache-poisoning false positive: setup-node v4.0.2 caches nothing unless `cache:` is set (explicitly false below); the package-manager-cache input zizmor keys on only exists in v5+.
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
          cache: false
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build -w @penguintechinc/react-console-version
      - name: Typecheck
        run: npm run typecheck -w @penguintechinc/react-console-version
      - name: Test
        run: npm run test -w @penguintechinc/react-console-version
      - name: Security
        run: npm audit --omit=dev

  build-react-hooks:
    name: Build & Test React Hooks
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/react-hooks/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      # zizmor cache-poisoning false positive: setup-node v4.0.2 caches nothing unless `cache:` is set (explicitly false below); the package-manager-cache input zizmor keys on only exists in v5+.
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
          cache: false
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build -w @penguintechinc/react-hooks
      - name: Typecheck
        run: npm run typecheck -w @penguintechinc/react-hooks
      - name: Test
        run: npm run test -w @penguintechinc/react-hooks
      - name: Security
        run: npm audit --omit=dev

  build-python-split:
    name: Build & Test Python Split Packages
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/python-crypto/') || startsWith(github.ref, 'refs/heads/release/python-security/') || startsWith(github.ref, 'refs/heads/release/python-libs/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install split packages
        run: |
          pip install bandit ruff
          pip install -e "packages/python-crypto[dev]" || pip install -e "packages/python-crypto"
          pip install -e "packages/python-security[dev]" || pip install -e "packages/python-security"
      - name: Install transition library
        run: pip install -e "packages/python-libs[dev]"
      - name: Lint
        run: |
          cd packages/python-crypto && ruff check src/
          cd ../python-security && ruff check src/
      - name: Security - bandit
        run: |
          cd packages/python-crypto && bandit -r src/ -ll
          cd ../python-security && bandit -r src/ -ll
      - name: Test transition library import
        run: python3 -c "import penguin_libs; from penguin_libs.validation import IsEmail; print('Transition import OK')"

  build-go-split:
    name: Build & Test Go Split Packages
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/go-logging/') || startsWith(github.ref, 'refs/heads/release/go-common/') || startsWith(github.ref, 'refs/heads/release/go-dal/') || startsWith(github.ref, 'refs/heads/release/go-xdp/') || startsWith(github.ref, 'refs/heads/release/go-numa/') }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: false
      - name: Build go-logging
        run: cd packages/go-logging && go build ./...
      - name: Vet go-logging
        run: cd packages/go-logging && go vet ./...
      - name: Test go-logging
        run: cd packages/go-logging && go test -race ./...
      - name: Build go-common (transition)
        run: cd packages/go-common && go build ./... && go vet ./...
      - name: Build go-dal
        run: cd packages/go-dal && go build ./... && go vet ./...
      - name: Test go-dal
        run: cd packages/go-dal && go test -race ./...
      - name: Build go-xdp
        run: cd packages/go-xdp && go build ./... && go vet ./...
      - name: Test go-xdp
        run: cd packages/go-xdp && go test -race ./...
      - name: Build go-numa
        run: cd packages/go-numa && go build ./... && go vet ./...
      - name: Test go-numa
        run: cd packages/go-numa && go test -race ./...
