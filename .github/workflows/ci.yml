name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-react:
    name: Build & Test React Libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -w @penguintechinc/react-libs
      - run: npm run typecheck -w @penguintechinc/react-libs
      - run: npm run test -w @penguintechinc/react-libs

  build-react-aaa:
    name: Build & Test React AAA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build -w @penguintechinc/react-aaa
      - name: Typecheck
        run: npm run typecheck -w @penguintechinc/react-aaa
      - name: Lint
        run: npm run lint -w @penguintechinc/react-aaa
      - name: Test
        run: npm test -w @penguintechinc/react-aaa
      - name: Security
        run: cd packages/react-aaa && npm audit --omit=dev

  build-python:
    name: Build & Test Python Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install build pytest pytest-asyncio requests bandit pip-audit
      - run: pip install -e "packages/python-libs[all,dev]"
      - run: pytest packages/python-libs/tests -v
      - run: pip install -e "packages/python-licensing[dev]"
      - run: pytest packages/python-licensing/tests -v
      - run: cd packages/python-secrets && pip install -e ".[dev]" && pytest tests -v
      - name: Lint - python-utils
        run: cd packages/python-utils && ruff check src/ tests/
      - name: Security - bandit
        run: cd packages/python-utils && bandit -r src/ -c pyproject.toml
      - name: Security - pip-audit
        run: cd packages/python-utils && pip-audit

  build-python-aaa:
    name: Build & Test Python AAA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: cd packages/python-aaa && pip install -e ".[dev]"
      - name: Lint
        run: cd packages/python-aaa && ruff check src/ tests/
      - name: Format check
        run: cd packages/python-aaa && ruff format --check src/ tests/
      - name: Type check
        run: cd packages/python-aaa && mypy src/
      - name: Security - bandit
        run: cd packages/python-aaa && bandit -r src/ -c pyproject.toml
      - name: Security - pip-audit
        run: cd packages/python-aaa && pip-audit
      - name: Test
        run: cd packages/python-aaa && pytest tests/ -v --tb=short --cov=penguin_aaa

  build-go:
    name: Build & Test Go Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test ./...
        working-directory: packages/go-common
      - run: go mod download
        working-directory: packages/go-h3
      - run: go test -race ./...
        working-directory: packages/go-h3
      - name: Lint - go-common
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: packages/go-common
      - name: Security - govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd packages/go-common && govulncheck ./...
      - name: Security - gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd packages/go-common && gosec -quiet ./...

  build-go-aaa:
    name: Build & Test Go AAA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: cd packages/go-aaa && go build ./...
      - name: Vet
        run: cd packages/go-aaa && go vet ./...
      - name: Test
        run: cd packages/go-aaa && go test -race -v ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: packages/go-aaa
      - name: Security - govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd packages/go-aaa && govulncheck ./...
      - name: Security - gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd packages/go-aaa && gosec -quiet ./...

  build-react-testutils:
    name: Build & Test react-testutils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build (typecheck)
        run: npm run build -w @penguintechinc/react-testutils
      - name: Typecheck
        run: npm run typecheck -w @penguintechinc/react-testutils
      - name: Test
        run: npm run test -w @penguintechinc/react-testutils

  build-flutter:
    name: Build Flutter Libs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter_libs
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-penguin-pytest:
    name: Build & Test penguin-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -e "packages/python-pytest[dev]"
      - name: Lint
        run: cd packages/python-pytest && ruff check src/ tests/
      - name: Format check
        run: cd packages/python-pytest && ruff format --check src/ tests/
      - name: Type check
        run: cd packages/python-pytest && mypy src/
      - name: Security - bandit
        run: cd packages/python-pytest && bandit -r src/ -c pyproject.toml
      - name: Test
        run: cd packages/python-pytest && pytest tests/ -v --tb=short

  build-go-rpc:
    name: Build & Test Go RPC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
      - name: Build
        run: cd packages/go-rpc && go build ./...
      - name: Test (coverage-gated, 90% minimum)
        run: |
          cd packages/go-rpc
          go test -race -coverprofile=cover.out $(go list ./... | grep -v /gen/ | grep -v /examples/ | grep -v /integration/)
          go tool cover -func=cover.out
          COVERAGE=$(go tool cover -func=cover.out | grep ^total: | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov+0 < 90.0) { exit 1 } }' || { echo "FAIL: coverage ${COVERAGE}% is below the 90% threshold"; exit 1; }
      - name: Lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          working-directory: packages/go-rpc
      - name: Security - govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          cd packages/go-rpc && govulncheck ./...
      - name: Security - gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          cd packages/go-rpc && gosec -quiet ./...

  build-python-rpc:
    name: Build & Test Python RPC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install
        run: cd packages/python-rpc && pip install -e ".[dev]"
      - name: Lint
        run: cd packages/python-rpc && ruff check src/ tests/
      - name: Format check
        run: cd packages/python-rpc && ruff format --check src/ tests/
      - name: Type check
        run: cd packages/python-rpc && mypy src/
      - name: Security - bandit
        run: cd packages/python-rpc && bandit -r src/ -c pyproject.toml
      - name: Security - pip-audit
        run: cd packages/python-rpc && pip install pip-audit && pip-audit
      - name: Test
        run: cd packages/python-rpc && pytest tests/ -v --tb=short --cov=penguin_rpc

  build-rust-rpc:
    name: Build & Test Rust RPC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust-rpc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-06-30)
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - name: Format check
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Security - cargo-deny
        run: |
          cargo install cargo-deny --version 0.18.9 --locked
          cargo deny check
