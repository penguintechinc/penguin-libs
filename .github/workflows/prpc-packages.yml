name: pRPC Packages

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/go-rpc/**'
      - 'packages/python-rpc/**'
      - 'packages/rust-rpc/**'
      - 'proto/**'
      - 'spec/**'
  push:
    branches: [main]
    paths:
      - 'packages/go-rpc/**'
      - 'packages/python-rpc/**'
      - 'packages/rust-rpc/**'
      - 'proto/**'
      - 'spec/**'

jobs:
  proto-lint:
    name: Lint & Format Protobuf
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
      - name: Lint
        run: buf lint
      - name: Format check
        run: buf format --diff --exit-code

  proto-breaking:
    name: Detect Breaking Protobuf Changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
      - name: Breaking change check
        run: buf breaking --against 'https://github.com/penguintechinc/penguin-libs.git#branch=main,subdir=proto'

  # Single matrix job reusing the exact step lists (and SHA-pinned actions) from
  # ci.yml's build-go-rpc / build-python-rpc / build-rust-rpc jobs verbatim, gated
  # by matrix.language so each language only runs its own steps.
  build-matrix:
    name: Build & Test pRPC Packages (${{ matrix.language }})
    needs: [proto-lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, rust]
    defaults:
      run:
        working-directory: packages/${{ matrix.language }}-rpc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # --- Go (mirrors ci.yml build-go-rpc) ---
      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
      - name: Go Build
        if: matrix.language == 'go'
        run: go build ./...
      - name: Go Test
        if: matrix.language == 'go'
        run: go test -race -v ./...
      - name: Go Lint
        if: matrix.language == 'go'
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          working-directory: packages/go-rpc
      - name: Go Security - govulncheck
        if: matrix.language == 'go'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Go Security - gosec
        if: matrix.language == 'go'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet ./...

      # --- Python (mirrors ci.yml build-python-rpc) ---
      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Python Install
        if: matrix.language == 'python'
        run: pip install -e ".[dev]"
      - name: Python Lint
        if: matrix.language == 'python'
        run: ruff check src/ tests/
      - name: Python Format check
        if: matrix.language == 'python'
        run: ruff format --check src/ tests/
      - name: Python Type check
        if: matrix.language == 'python'
        run: mypy src/
      - name: Python Security - bandit
        if: matrix.language == 'python'
        run: bandit -r src/ -c pyproject.toml
      - name: Python Security - pip-audit
        if: matrix.language == 'python'
        run: pip install pip-audit && pip-audit
      - name: Python Test
        if: matrix.language == 'python'
        run: pytest tests/ -v --tb=short --cov=penguin_rpc

      # --- Rust (mirrors ci.yml build-rust-rpc) ---
      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-06-30)
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - name: Rust Format check
        if: matrix.language == 'rust'
        run: cargo fmt --all --check
      - name: Rust Lint
        if: matrix.language == 'rust'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust Test
        if: matrix.language == 'rust'
        run: cargo test --workspace
      - name: Rust Security - cargo-deny
        if: matrix.language == 'rust'
        run: |
          cargo install cargo-deny --version 0.18.9 --locked
          cargo deny check

  # NOTE: Cross-language integration job (mirroring h3-packages.yml's
  # integration-test job — building the Go server, exercising it from the
  # Python client, etc.) is intentionally deferred to Phase 1, once the first
  # pRPC server implementation exists. Do not add a placeholder job here.
