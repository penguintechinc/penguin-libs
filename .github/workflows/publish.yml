  # ============================================
  # Go split packages - validate only (Go modules publish via tags)
  # ============================================
  validate-go-split:
    name: Validate Go Split Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.package == 'all' ||
      startsWith(github.ref, 'refs/tags/go-logging-v') ||
      startsWith(github.ref, 'refs/tags/go-numa-v') ||
      startsWith(github.ref, 'refs/tags/go-xdp-v') ||
      startsWith(github.ref, 'refs/tags/go-dal-v') ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: false

      - name: Build, vet and test go split packages
        run: |
          for pkg in go-logging go-numa go-xdp go-dal; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && go build ./... && go vet ./... && go test -race ./...)
            echo "::endgroup::"
          done
