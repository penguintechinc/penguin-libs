name: Publish Packages

# Release flow (per-library release branches):
#   1. Work lands on release/{library}/vX.X.x (library = the packages/ dir name,
#      e.g. release/react-libs/v2.0.x, release/python-aaa/v0.2.x).
#   2. ci.yml (and h3-packages.yml / prpc-packages.yml where paths match) runs on
#      every push/PR against that branch, scoped to just that library's job via the
#      per-job `if:` release-branch gate in ci.yml.
#   3. Once validated, cut a tag matching the library's prefix below
#      (e.g. react-libs-v2.0.0) from the release branch — that tag push triggers
#      this workflow's publish job for that library. Publishing itself is tag-driven
#      only; no branch-based publish triggers exist or are needed here.
#   4. Packages with no publish job (see validate-* jobs below, e.g. Go modules
#      consumed via `go get`) are validated on any tag push but never published to a
#      registry from this workflow.
on:
  push:
    tags:
      - 'react-libs-v*'
      - 'react-aaa-v*'
      - 'react-testutils-v*'
      - 'react-form-builder-v*'
      - 'react-login-v*'
      - 'react-sidebar-v*'
      - 'react-console-version-v*'
      - 'react-hooks-v*'
      - 'penguin-libs-v*'
      - 'penguin-licensing-v*'
      - 'penguin-secrets-v*'
      - 'penguin-utils-v*'
      - 'penguin-aaa-v*'
      - 'penguin-dal-v*'
      - 'penguin-email-v*'
      - 'penguin-limiter-v*'
      - 'penguin-security-v*'
      - 'flutter-libs-v*'
      - 'go-aaa-v*'
      - 'go-common-v*'
      - 'go-h3-v*'
      - 'go-logging-v*'
      - 'go-xdp-v*'
      - 'go-numa-v*'
      - 'go-dal-v*'
      - 'penguin-prpc-v*'
      - 'rust-rpc-v*'
      - 'go-rpc-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'react-libs'
        type: choice
        options:
          - react-libs
          - react-aaa
          - react-testutils
          - react-form-builder
          - react-login
          - react-sidebar
          - react-console-version
          - react-hooks
          - python-libs
          - python-licensing
          - python-secrets
          - python-utils
          - python-aaa
          - python-dal
          - python-email
          - python-limiter
          - python-security
          - flutter-libs
          - python-rpc
          - rust-rpc
          - go-rpc
          - all

permissions:
  contents: read

jobs:
  # ============================================
  # React Libraries - npm (public registry)
  # ============================================
  publish-react-libs:
    name: Publish React Libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.package == 'react-libs' || github.event.inputs.package == 'all') ||
      startsWith(github.ref, 'refs/tags/react-libs-v') ||
      startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: packages/react-libs

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      # zizmor cache-poisoning false positive: setup-node v4.0.2 caches nothing unless `cache:` is set (explicitly false below); the package-manager-cache input zizmor keys on only exists in v5+.
      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@penguintechinc'
          cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build package
        run: npm run build

      - name: Run type check
        run: npm run typecheck

      - name: Publish to npm (public registry)
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release summary
        run: |
          echo "## Published Package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: @penguintechinc/react-libs" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: $(node -p "require('./package.json').version")" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: npm (public registry)" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Python Libs - PyPI
  # ============================================
  publish-python-libs:
    name: Publish Python Libs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.package == 'python-libs' || github.event.inputs.package == 'all') ||
      startsWith(github.ref, 'refs/tags/penguin-libs-v') ||
      startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: packages/python-libs

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/python-libs/dist/

      - name: Create release summary
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "## Published Package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: penguin-libs" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: PyPI (trusted publishing)" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Python Licensing - PyPI
