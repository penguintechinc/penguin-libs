name: H3 Packages

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'packages/go-h3/**'
      - 'proto/**'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'packages/go-h3/**'
      - 'proto/**'

permissions:
  contents: read

jobs:
  proto-lint:
    name: Lint Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
      - run: cd proto && buf lint

  build-go-h3:
    name: Build & Test Go H3
    runs-on: ubuntu-latest
    needs: proto-lint
    defaults:
      run:
        working-directory: packages/go-h3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: false
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  integration-test:
    name: Go H3 Integration
    runs-on: ubuntu-latest
    needs: [build-go-h3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Generate test certificates
        run: ./scripts/generate-test-certs.sh ./certs
      - name: Build Go server
        run: |
          cd packages/go-h3
          go build -o ../../bin/echo-server ./examples/echo-server/
      - name: Run integration tests
        run: |
          if [ -d tests/integration ]; then
            ./tests/integration/run-all.sh || echo "Integration tests not yet implemented"
          else
            echo "Integration test directory not yet created"
          fi
