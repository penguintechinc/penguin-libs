version: v2
plugins:
  # Go protobuf messages
  - remote: buf.build/protocolbuffers/go
    out: ../gen/go
    opt: paths=source_relative
  # ConnectRPC Go handlers + clients
  - remote: buf.build/connectrpc/go
    out: ../gen/go
    opt: paths=source_relative
  # Python protobuf messages
  - remote: buf.build/protocolbuffers/python
    out: ../packages/python-libs/src/penguin_libs/gen
  # go-rpc: Go protobuf messages (prpc/* only — scoped via `buf generate --path prpc`)
  - remote: buf.build/protocolbuffers/go
    out: ../packages/go-rpc/gen
    opt: paths=source_relative
  # go-rpc: ConnectRPC Go handlers + clients (prpc/* only — scoped via `buf generate --path prpc`)
  - remote: buf.build/connectrpc/go
    out: ../packages/go-rpc/gen
    opt: paths=source_relative
